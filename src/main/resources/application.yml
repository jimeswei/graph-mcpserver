spring:
  profiles:
    active: dev
  main:
    banner-mode: off
  application:
    name: knowledge-graph-algorithrm-service
  datasource:
    url: jdbc:mysql://192.168.3.78:3307/graph-agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&autoReconnect=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        hbm2ddl:
          auto: none
    open-in-view: false
    defer-datasource-initialization: true
  ai:
    mcp:
      server:
        name: knowledge-graph-algorithrm-service
        type: ASYNC
        enabled: true
        version: 1.0.0
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        request-timeout: 60000
        max-connections: 100
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true
        port: 5821

logging:
  level:
    com.example.graph.mcp: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE








